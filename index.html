<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Hub</title>
<meta name="description" content="Exam prep for every module.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top"><div class="wrap top-in"><div class="brand"><div class="eyebrow">Exam prep</div><h1>Study <span>Hub</span></h1></div></div></header>
<main class="wrap"><div class="view">
  <p class="muted">Pick a module. Progress is saved separately for each one, in this browser.</p>
  <div class="hub-grid" id="hub"></div>
</div></main>
<script src="modules.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var list = window.STUDY_MODULES || [];
  document.getElementById('hub').innerHTML = list.length ? list.map(function (m) {
    return '<a class="card hub-card" href="' + esc(m.path) + '"><span class="code">' + esc(m.code) + '</span><h3>' + esc(m.name) + '</h3><p class="muted small">' + esc(m.note) + '</p></a>';
  }).join('') : '<div class="card"><p>No modules yet. Add one in modules.js.</p></div>';
})();
</script>
</body>
</html>
